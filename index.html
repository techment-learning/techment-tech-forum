<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Techment Tech Forum</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Cpolygon points=%2749.8,0 25.4,50.2 50,33.3 74.4,50.2%27 fill=%27%233AE8AD%27/%3E%3Cpolygon points=%2750,49.7 13.3,74.8 1.3,99.7 50.2,74.6 98.6,99.8 86.5,74.8%27 fill=%27%233F79DA%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#3F79DA; --blue-btn:#2E63C0; --blue-dark:#1F4A99; --blue-ink:#2553A8; --blue-lt:#EAF1FC; --blue-wash:#F1F6FE; --blue-line:#BFD3F4;
  --teal:#3AE8AD; --teal-lt:#DDF8EE; --teal-ink:#0B5A43; --teal-line:#9FE6CB;
  --navy:#0E1B3D; --navy2:#16264F; --navy3:#3A4B78; --on-navy:#C9D3EA; --on-navy-soft:#A9B6D3;
  --amber-lt:#FFF1E0; --amber-wash:#FFF6EA; --amber-ink:#8A4B08; --amber-line:#F3D3A6; --amber-deep:#6B3B06;
  --red-lt:#FDECEC; --red-ink:#A12626;
  --bg:#F5F7FB; --surface:#FFFFFF; --line:#E1E6F0; --line2:#D5DCEA; --line3:#EEF1F6;
  --ink:#14203A; --ink2:#2A3550; --ink3:#3D4760; --muted:#56627A;
  --r:12px; --r-lg:16px;
  --display:'Sora',system-ui,sans-serif; --sans:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);font-size:15px;line-height:1.5}
a{color:var(--blue-btn)} a:hover{color:var(--blue-dark)}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:15px;color:var(--ink)}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--r);border:1px solid transparent;font-weight:600;font-size:15px;white-space:nowrap}
.btn-primary{background:var(--blue-btn);color:#fff}
.btn-primary:hover{background:var(--blue-dark)}
.btn-primary:disabled{background:var(--line2);color:var(--muted);cursor:not-allowed}
.btn-ghost{background:#fff;border-color:#C9D2E3;color:var(--ink3);font-weight:500}
.btn-ghost:hover{border-color:var(--blue);color:var(--blue-btn)}
.btn-sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:8px}
.btn-link{background:none;border:none;color:var(--blue-btn);font-weight:600;padding:6px 8px;min-height:36px}
.btn-danger{background:#fff;border-color:#E9B8B8;color:var(--red-ink);font-weight:500}

/* Login */
#login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--navy)}
.login-card{width:100%;max-width:420px;background:#fff;border-radius:20px;padding:36px 32px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:12px}
.brand-name{font-family:var(--display);font-weight:700;font-size:19px}
.brand-sub{font-size:12px;font-weight:500;letter-spacing:.6px;text-transform:uppercase}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
.input,.textarea,.select{width:100%;border:1px solid var(--line2);border-radius:10px;background:#fff;padding:0 14px;height:46px;font-weight:400}
.textarea{padding:12px 14px;height:auto;line-height:1.55;resize:vertical}
.input:focus,.textarea:focus,.select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(63,121,218,.15)}
.err{display:none;padding:10px 14px;border-radius:10px;background:var(--red-lt);color:var(--red-ink);font-size:14px}
.hint{font-size:13px;color:var(--muted);font-weight:400}

/* Shell */
#app{display:none;height:100%}
.shell{display:flex;height:100%}
.sidebar{width:256px;flex-shrink:0;background:var(--navy);color:#fff;display:flex;flex-direction:column;gap:26px;padding:26px 18px 18px;overflow-y:auto}
.sidebar .brand{padding:0 8px}
.sidebar .brand-sub{color:var(--teal)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;justify-content:space-between;min-height:44px;padding:0 14px;border-radius:10px;font-size:15px;font-weight:500;color:var(--on-navy);text-decoration:none}
.nav a:hover{background:var(--navy2);color:#fff}
.nav a.active{background:var(--blue-btn);color:#fff}
.count{font-size:12px;font-weight:600;background:var(--teal);color:var(--navy);border-radius:999px;padding:2px 8px}
.side-h{font-size:12px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--on-navy-soft);padding:0 14px 6px}
.techs{display:flex;flex-direction:column;gap:2px;flex-grow:1}
.tech{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 6px 0 14px}
.tech a{color:#E6ECF8;text-decoration:none;font-size:14px;padding:6px 0;flex-grow:1}
.tech a.on{color:var(--teal)}
.follow{font-size:12px;font-weight:500;border-radius:999px;padding:4px 10px;min-width:78px;border:1px solid var(--navy3);background:transparent;color:var(--on-navy)}
.follow[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--navy)}
.me{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding:12px;border-radius:12px;background:var(--navy2)}
.me > div:nth-child(2){flex:1;min-width:0}
.avatar{width:38px;height:38px;flex-shrink:0;border-radius:999px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:14px;background:var(--teal);color:var(--navy)}
.me-name{font-size:14px;font-weight:600}
.me-sub{font-size:12px;color:var(--on-navy-soft)}
.signout{width:100%;min-height:36px;border-radius:8px;background:transparent;border:1px solid var(--navy3);color:var(--on-navy);font-size:13px}
.signout:hover{border-color:var(--teal);color:#fff}

.main{flex-grow:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:76px;flex-shrink:0;display:flex;align-items:center;gap:16px;padding:0 32px;background:#fff;border-bottom:1px solid var(--line)}
.menu-btn{display:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--line2);background:#fff;align-items:center;justify-content:center}
.search{flex-grow:1;min-width:0;max-width:640px;display:flex;align-items:center;gap:10px;height:44px;padding:0 16px;border:1px solid var(--line2);border-radius:12px;background:#F8FAFD}
.search input{flex-grow:1;min-width:0;width:100%;border:none;outline:none;background:transparent}
.search:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(63,121,218,.15)}
.spacer{flex-grow:1}
.view{flex-grow:1;overflow-y:auto}
.cols{display:flex;gap:28px;padding:32px 36px 56px;align-items:flex-start;max-width:1320px}
.col-main{flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:20px}
.col-rail{width:320px;flex-shrink:0;display:flex;flex-direction:column;gap:20px}
.page-h{display:flex;flex-direction:column;gap:6px}
.page-h h1{font-size:28px;font-weight:600}
.page-h p{margin:0;color:var(--muted)}

.banner{display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:12px;font-size:14px;font-weight:500}
.banner-ok{background:var(--teal-lt);color:var(--teal-ink)}
.banner-warn{background:var(--amber-wash);color:var(--amber-deep);border:1px solid var(--amber-line)}
.banner-info{background:var(--blue-wash);color:var(--blue-ink);border:1px solid var(--blue-line)}

.tabs{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line)}
.tablist{display:flex;gap:4px;flex-wrap:wrap}
.tab{min-height:44px;padding:0 16px;background:none;border:none;border-bottom:3px solid transparent;font-size:15px;font-weight:600;color:var(--muted);margin-bottom:-1px;text-decoration:none;display:inline-flex;align-items:center}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--blue-btn)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:500;border:1px solid var(--line2);background:#fff;color:var(--ink3)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.pick[aria-pressed="true"]{background:var(--blue-btn);border-color:var(--blue-btn)}

.card{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg)}
.post{display:flex;gap:18px;padding:20px 22px}
.vote-col{display:flex;flex-direction:column;align-items:center;gap:2px;width:48px;flex-shrink:0}
.vote{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line2);background:#fff;color:var(--ink3)}
.vote[aria-pressed="true"]{background:var(--blue-btn);border-color:var(--blue-btn);color:#fff}
.vote:disabled{opacity:.5;cursor:not-allowed}
.vote-n{font-size:15px;font-weight:600}
.post-body{flex-grow:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.meta-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}
.pill-solved{background:var(--teal-lt);color:var(--teal-ink)}
.pill-open{background:#EEF0F5;color:var(--ink3)}
.pill-unanswered{background:var(--amber-lt);color:var(--amber-ink)}
.pill-discussion{background:var(--blue-lt);color:var(--blue-ink)}
.post-title{font-family:var(--display);font-size:18px;font-weight:600;line-height:1.35;color:var(--ink);text-decoration:none}
.post-title:hover{color:var(--blue-btn)}
.excerpt{margin:0;font-size:14px;line-height:1.55;color:var(--ink3);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:500;padding:4px 10px;border-radius:6px;background:var(--blue-lt);color:var(--blue-ink)}
.ans-box{width:92px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:12px;border:1px solid var(--line);background:#F8FAFD;align-self:flex-start;padding:12px 0;color:var(--ink3)}
.ans-box b{font-family:var(--display);font-size:22px;font-weight:600}
.ans-box span{font-size:12px}
.ans-box.solved{background:var(--teal-lt);border-color:var(--teal-line);color:var(--teal-ink)}
.ans-box.none{background:var(--amber-wash);border-color:var(--amber-line);color:var(--amber-ink)}
.empty{padding:40px;text-align:center;border:1px dashed #C9D2E3;border-radius:var(--r-lg);background:#fff;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty h2{font-size:18px}

.rail-card{padding:22px;border-radius:var(--r-lg);background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.rail-card h2{font-size:16px;font-weight:600}
.rail-dark{background:var(--navy);border-color:var(--navy);color:#fff}
.rail-dark p{margin:0;font-size:14px;line-height:1.5;color:var(--on-navy)}
.rail-dark .btn-outline{align-self:flex-start;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--teal);background:transparent;color:var(--teal);font-size:14px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center}
.badge-teal{align-self:flex-start;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--teal);color:var(--navy)}
.person{display:flex;align-items:center;gap:12px}
.person .avatar{background:var(--blue-lt);color:var(--blue-ink)}
.person .avatar.top{background:var(--navy);color:var(--teal)}
.person-name{font-size:14px;font-weight:600}
.person-sub{font-size:12px;color:var(--muted)}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:7px 0;border-top:1px solid var(--line3)}
.kv span:first-child{color:var(--ink3)}
.kv span:last-child{font-weight:600;text-align:right}
.rel{display:flex;flex-direction:column;gap:4px;padding:10px 0 2px;border-top:1px solid var(--line3);text-decoration:none}
.rel b{font-size:14px;font-weight:500;line-height:1.45;color:var(--ink)}
.rel span{font-size:12px;color:var(--muted)}
.rel:hover b{color:var(--blue-btn)}

/* Thread */
.thread-h h1{font-size:26px;font-weight:600;line-height:1.3}
.md{font-size:15px;line-height:1.65;color:var(--ink2);overflow-wrap:anywhere}
.md p{margin:0 0 12px}.md p:last-child{margin-bottom:0}
.md ul,.md ol{margin:0 0 12px;padding-left:22px}
.md code{font-family:var(--mono);font-size:13px;background:#EEF1F6;padding:1px 5px;border-radius:4px}
.code{border-radius:12px;overflow:hidden;border:1px solid #1F2E57;margin:0 0 12px}
.code-h{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 6px 14px;background:var(--navy2);color:var(--on-navy-soft);font-size:12px;font-family:var(--mono)}
.code-h button{background:none;border:1px solid var(--navy3);color:var(--on-navy);border-radius:6px;font-size:12px;padding:3px 10px}
.code pre{margin:0;padding:14px 16px;background:var(--navy);color:#E6ECF8;font-family:var(--mono);font-size:13px;line-height:1.6;overflow-x:auto}
.code pre code{background:none;padding:0;color:inherit}
.ai{padding:22px 24px;border-radius:var(--r-lg);background:var(--blue-wash);border:1px solid var(--blue-line);display:flex;flex-direction:column;gap:12px}
.ai-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ai-icon{width:32px;height:32px;border-radius:9px;background:var(--blue-btn);display:flex;align-items:center;justify-content:center}
.ai-h b{font-family:var(--display);font-size:15px;font-weight:600}
.ai-tag{font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;background:#fff;color:var(--blue-ink);border:1px solid var(--blue-line)}
.fb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.fb button{min-height:36px;padding:0 14px;border-radius:8px;font-size:13px;font-weight:500;border:1px solid #C9D2E3;background:#fff;color:var(--ink3)}
.fb button[aria-pressed="true"].up{background:var(--teal-lt);border-color:var(--teal-line);color:var(--teal-ink)}
.fb button[aria-pressed="true"].down{background:var(--amber-lt);border-color:var(--amber-line);color:var(--amber-ink)}
.pending{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--blue-ink)}
.dots span{display:inline-block;width:6px;height:6px;margin-right:4px;border-radius:50%;background:var(--blue);animation:b 1.2s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
.takeaway{display:flex;gap:10px;font-size:14px;line-height:1.55;color:var(--ink2)}
.takeaway i{width:8px;height:8px;margin-top:7px;flex-shrink:0;border-radius:999px;background:var(--teal)}
.answer.accepted{border:2px solid var(--teal)}
.acc{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--teal-ink);background:var(--teal-lt);padding:6px 12px;border-radius:8px}
.champ{font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--navy);color:var(--teal)}
.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flagged{font-size:12px;font-weight:600;color:var(--red-ink);background:var(--red-lt);padding:3px 8px;border-radius:6px}

/* Ask */
.type-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.type-opt{text-align:left;padding:16px 18px;border-radius:12px;border:2px solid var(--line);background:#fff;display:flex;flex-direction:column;gap:4px}
.type-opt[aria-pressed="true"]{border-color:var(--blue-btn);background:var(--blue-wash)}
.type-opt b{font-family:var(--display);font-size:15px}
.type-opt span{font-size:13px;color:var(--muted);line-height:1.45}
.similar{padding:14px 16px;border-radius:12px;background:var(--blue-wash);border:1px solid var(--blue-line);display:flex;flex-direction:column;gap:6px}
.similar a{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--ink);padding:4px 0}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 18px;border-radius:12px;background:#F8FAFD;border:1px solid var(--line)}
.switch{width:52px;height:30px;flex-shrink:0;border-radius:999px;border:none;padding:3px;display:flex;justify-content:flex-start;background:#8C98B1}
.switch[aria-checked="true"]{justify-content:flex-end;background:var(--blue-btn)}
.switch i{width:24px;height:24px;border-radius:999px;background:#fff;box-shadow:0 1px 2px rgba(14,27,61,.3)}
.step{display:flex;gap:12px;font-size:14px;line-height:1.5;color:var(--ink2)}
.step b{width:24px;height:24px;flex-shrink:0;border-radius:999px;background:var(--blue-lt);color:var(--blue-ink);font-size:12px;display:flex;align-items:center;justify-content:center}

/* Insights & admin */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{padding:20px 22px;border-radius:14px;background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.kpi span{font-size:13px;color:var(--muted)}
.kpi b{font-family:var(--display);font-size:30px;font-weight:600;letter-spacing:-.5px}
.kpi small{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.bar-row{display:grid;grid-template-columns:84px minmax(0,1fr) 36px;align-items:center;gap:12px;font-size:14px}
.bar{height:12px;border-radius:999px;background:var(--line3)}
.bar i{display:block;height:12px;border-radius:999px;background:var(--blue)}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
.table td{padding:10px;border-bottom:1px solid var(--line3);vertical-align:middle}
.form-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:10px;align-items:end}
.ai-out{white-space:normal}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;box-shadow:0 10px 25px rgba(14,27,61,.25);z-index:50;display:none;max-width:90vw}
.loading{padding:60px;text-align:center;color:var(--muted)}

@media (max-width:1180px){ .col-rail{display:none} .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:860px){
  .sidebar{position:fixed;inset:0 auto 0 0;z-index:40;transform:translateX(-100%);transition:transform .2s}
  .sidebar.open{transform:none;box-shadow:0 0 0 100vmax rgba(14,27,61,.45)}
  .menu-btn{display:inline-flex}
  .topbar{padding:0 16px;gap:10px}
  .topbar .btn-primary .lbl{display:none}
  .topbar .btn-primary{padding:0 12px;flex-shrink:0}
  .topbar .spacer{display:none}
  .tabs .hint{display:none}
  .tablist{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .tab{flex-shrink:0}
  .cols{padding:20px 16px 48px}
  .post{padding:16px;gap:12px}
  .ans-box{display:none}
  .grid2,.type-grid{grid-template-columns:minmax(0,1fr)}
  .form-row{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:minmax(0,1fr)}
}
</style>
</head>
<body>

<!-- ============================== LOGIN ============================== -->
<div id="login">
  <form class="login-card" id="loginForm" autocomplete="on">
    <div class="brand">
      <svg width="40" height="40" viewBox="0 0 100 100" aria-hidden="true" style="display:block;flex-shrink:0"><polygon points="49.8,0 25.4,50.2 50,33.3 74.4,50.2" fill="#3AE8AD"/><polygon points="50,49.7 13.3,74.8 1.3,99.7 50.2,74.6 98.6,99.8 86.5,74.8" fill="#3F79DA"/></svg>
      <div><div class="brand-name">Techment</div><div class="brand-sub" style="color:var(--blue-btn)">Tech Forum</div></div>
    </div>
    <div>
      <h1 style="font-size:24px;font-weight:600">Sign in</h1>
      <p class="hint" style="margin:6px 0 0">Ask questions, share answers and learn from colleagues across Techment.</p>
    </div>
    <div class="err" id="loginErr" role="alert"></div>
    <label class="field">Work email
      <input class="input" id="loginEmail" type="email" autocomplete="username" placeholder="name@techment.com" required>
    </label>
    <label class="field">Password
      <input class="input" id="loginPass" type="password" autocomplete="current-password" placeholder="Enter your password" required>
    </label>
    <button class="btn btn-primary" id="loginBtn" type="submit">Sign in</button>
    <p class="hint" style="margin:0">Need access? Ask the Learning &amp; Development team to add you.</p>
  </form>
</div>

<!-- ============================== APP ============================== -->
<div id="app">
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Forum navigation"></aside>
    <div class="main">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="Open menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <label class="search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#56627A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <span class="sr">Search the forum</span>
          <input type="search" id="search" placeholder="Search questions, tags or people…" autocomplete="off">
        </label>
        <div class="spacer"></div>
        <a class="btn btn-primary" href="#/ask" style="text-decoration:none" aria-label="Ask a question">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span class="lbl">Ask a question</span>
        </a>
      </header>
      <div class="view" id="view"><div class="loading">Loading the forum…</div></div>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  // ======================================================================
  // CONFIGURATION — set this once your Cloudflare Worker is deployed.
  // ======================================================================
  const CONFIG = {
    WORKER_URL: "https://techment-tech-forum.sreejit-panicker.workers.dev",
    POLL_SECONDS: 60
  };

  // ---------------------------------------------------------------- state
  let SESSION = null;        // { email, key, name, role }
  let DATA = null;           // forum content (already redacted by the Worker)
  let PEOPLE = [];           // [{ email, name, role }]
  let LAST_JSON = '';
  let STALE = false;         // new activity arrived while the person was typing
  let PENDING_AI = {};       // threadId -> true while the AI draft is being written
  let MODULES_TEXT = '';
  const ASK = { type: 'question', title: '', body: '', tags: [], anon: false };
  const REPLY = {};          // threadId -> draft text
  const UI = { tab: 'latest', tag: 'All', q: '' };

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const workerUrl = (p) => CONFIG.WORKER_URL.replace(/\/+$/, '') + p;

  // ---------------------------------------------------------------- icons
  const I = {
    up: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
    check: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>',
    back: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
    spark: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6"/></svg>',
    warn: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h.01"/></svg>',
    logo: '<svg width="34" height="34" viewBox="0 0 100 100" aria-hidden="true" style="display:block;flex-shrink:0"><polygon points="49.8,0 25.4,50.2 50,33.3 74.4,50.2" fill="#3AE8AD"/><polygon points="50,49.7 13.3,74.8 1.3,99.7 50.2,74.6 98.6,99.8 86.5,74.8" fill="#3F79DA"/></svg>'
  };

  // ---------------------------------------------------------------- API
  async function sha256(str) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');
  }

  async function api(path, opts) {
    opts = opts || {};
    const headers = { 'Content-Type': 'application/json' };
    if (SESSION) { headers['X-Forum-User'] = SESSION.email; headers['X-Forum-Key'] = SESSION.key; }
    let res;
    try {
      res = await fetch(workerUrl(path), { method: opts.method || 'GET', headers, body: opts.body ? JSON.stringify(opts.body) : undefined });
    } catch (e) {
      throw new Error('Could not reach the forum service. Check your connection and try again.');
    }
    const data = await res.json().catch(() => ({}));
    if (res.status === 401 && SESSION) { signOut('Your session has ended. Please sign in again.'); throw new Error('Not signed in'); }
    if (!res.ok) throw new Error(data.error ? data.error + (data.detail && data.error !== data.detail && res.status >= 500 ? ' — ' + data.detail : '') : 'Request failed (' + res.status + ')');
    return data;
  }

  async function op(name, payload, okMsg) {
    try {
      const res = await api('/op', { method: 'POST', body: Object.assign({ op: name }, payload || {}) });
      if (res.content) setData(res.content);
      if (res.people) PEOPLE = res.people;
      if (okMsg) toast(okMsg);
      render();
      return res;
    } catch (e) {
      toast(e.message);
      throw e;
    }
  }

  function setData(content) {
    DATA = content;
    LAST_JSON = JSON.stringify(content);
    STALE = false;
  }

  async function load(opts) {
    const res = await api('/data');
    PEOPLE = res.people || [];
    if (res.me) { SESSION.name = res.me.name; SESSION.role = res.me.role; saveSession(); }
    const next = JSON.stringify(res.content);
    if (next === LAST_JSON) return false;
    if (opts && opts.quiet && isTyping()) { STALE = true; DATA = res.content; renderStaleOnly(); return true; }
    setData(res.content);
    return true;
  }

  // ---------------------------------------------------------------- session
  function saveSession() { try { sessionStorage.setItem('tech_forum_user', JSON.stringify(SESSION)); } catch (e) {} }
  function loadSession() { try { const s = sessionStorage.getItem('tech_forum_user'); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
  function clearSession() { try { sessionStorage.removeItem('tech_forum_user'); } catch (e) {} }

  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = $('loginEmail').value.toLowerCase().trim();
    const pass = $('loginPass').value;
    const btn = $('loginBtn'), err = $('loginErr');
    err.style.display = 'none';
    btn.disabled = true; btn.textContent = 'Signing in…';
    try {
      const key = await sha256(pass);
      const res = await fetch(workerUrl('/login'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, key }) });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(res.status === 401 ? 'Incorrect email or password.' : (data.error || 'Sign-in failed.') + (data.detail ? ' — ' + data.detail : ''));
      SESSION = { email, key, name: data.user.name, role: data.user.role };
      saveSession();
      $('loginPass').value = '';
      await startApp();
    } catch (ex) {
      err.textContent = ex.message === 'Failed to fetch' ? 'Could not reach the forum service. Check the Worker URL in CONFIG.' : ex.message;
      err.style.display = 'block';
    } finally {
      btn.disabled = false; btn.textContent = 'Sign in';
    }
  });

  function signOut(msg) {
    SESSION = null; DATA = null; LAST_JSON = ''; clearSession();
    $('app').style.display = 'none'; $('login').style.display = 'flex';
    if (msg) { $('loginErr').textContent = msg; $('loginErr').style.display = 'block'; }
  }

  async function startApp() {
    $('login').style.display = 'none';
    $('app').style.display = 'block';
    renderSidebar();
    try { await load(); render(); }
    catch (e) { $('view').innerHTML = `<div class="cols"><div class="col-main"><div class="banner banner-warn">${I.warn}<span>${esc(e.message)}</span></div></div></div>`; }
  }

  // ---------------------------------------------------------------- polling
  setInterval(async () => {
    if (!SESSION || document.hidden) return;
    try { if (await load({ quiet: true })) { if (!STALE) render(); } } catch (e) {}
  }, CONFIG.POLL_SECONDS * 1000);

  function watchAi(id) {
    PENDING_AI[id] = true;
    let n = 0;
    const tick = async () => {
      n++;
      try { await load({ quiet: true }); } catch (e) {}
      const t = DATA && DATA.threads.find((x) => x.id === id);
      if ((t && t.ai) || n >= 15) { delete PENDING_AI[id]; if (!STALE) render(); return; }
      setTimeout(tick, 4000);
    };
    setTimeout(tick, 4000);
  }

  function isTyping() {
    const a = document.activeElement;
    const typing = a && (a.tagName === 'TEXTAREA' || (a.tagName === 'INPUT' && a.type !== 'search'));
    const drafts = ASK.title || ASK.body || Object.values(REPLY).some(Boolean);
    return typing || drafts;
  }

  function renderStaleOnly() {
    const el = $('staleBar');
    if (el) el.style.display = 'flex';
  }

  // ---------------------------------------------------------------- helpers
  const people = (email) => PEOPLE.find((p) => p.email === email);
  const nameOf = (email) => { const p = people(email); return p ? p.name : (email || ''); };
  const initials = (name) => String(name || '?').split(/\s+/).filter(Boolean).slice(0, 2).map((s) => s[0].toUpperCase()).join('');
  const live = (arr) => (arr || []).filter((x) => !x.deleted);
  const isAdmin = () => SESSION && SESSION.role === 'Admin';
  const canCurate = () => SESSION && (SESSION.role === 'Admin' || SESSION.role === 'Champion');
  const canInsights = () => SESSION && ['Admin', 'Champion', 'Leadership'].includes(SESSION.role);
  const championTags = (email) => Object.keys(DATA.champions || {}).filter((k) => DATA.champions[k] === email);

  function ago(iso) {
    const s = (Date.now() - Date.parse(iso)) / 1000;
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s / 60) + 'm ago';
    if (s < 86400) return Math.floor(s / 3600) + 'h ago';
    if (s < 172800) return 'yesterday';
    if (s < 604800) return Math.floor(s / 86400) + ' days ago';
    return new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
  }
  function duration(ms) {
    const m = Math.round(ms / 60000);
    if (m < 60) return m + 'm';
    const h = Math.floor(m / 60);
    if (h < 48) return h + 'h ' + (m % 60) + 'm';
    return Math.round(h / 24) + ' days';
  }

  function status(t) {
    if (t.type === 'discussion') return { label: 'Discussion', cls: 'pill-discussion' };
    if (t.acceptedId) return { label: 'Solved', cls: 'pill-solved' };
    if (!live(t.answers).length) return { label: 'Unanswered', cls: 'pill-unanswered' };
    return { label: 'Open', cls: 'pill-open' };
  }
  function answerWord(t, n) { return t.type === 'discussion' ? (n === 1 ? 'reply' : 'replies') : (n === 1 ? 'answer' : 'answers'); }
  function authorLine(t) {
    const p = t.authorEmail ? people(t.authorEmail) : null;
    const nm = t.authorName || 'Anonymous';
    return nm + (t.anon && t.mine ? ' (posted anonymously)' : '') + (p && p.role !== 'Member' ? '' : '');
  }

  function toast(msg) {
    const el = $('toast');
    el.textContent = msg; el.style.display = 'block';
    clearTimeout(toast._t); toast._t = setTimeout(() => { el.style.display = 'none'; }, 3800);
  }

  // Minimal, safe Markdown: fenced code, inline code, bold, links, lists, paragraphs.
  function md(src) {
    const parts = String(src || '').split('```');
    return parts.map((p, i) => {
      if (i % 2 === 1) {
        let lang = '', code = p;
        const nl = p.indexOf('\n');
        if (nl >= 0 && /^[\w+#.-]*$/.test(p.slice(0, nl).trim())) { lang = p.slice(0, nl).trim(); code = p.slice(nl + 1); }
        return `<div class="code"><div class="code-h"><span>${esc(lang || 'code')}</span><button type="button" data-copy>Copy</button></div><pre><code>${esc(code.replace(/\n$/, ''))}</code></pre></div>`;
      }
      return p.split(/\n{2,}/).map((block) => {
        const b = block.replace(/^\n+|\n+$/g, '');
        if (!b.trim()) return '';
        const lines = b.split('\n');
        if (lines.every((l) => /^\s*[-*]\s+/.test(l))) return '<ul>' + lines.map((l) => '<li>' + inline(l.replace(/^\s*[-*]\s+/, '')) + '</li>').join('') + '</ul>';
        if (lines.every((l) => /^\s*\d+[.)]\s+/.test(l))) return '<ol>' + lines.map((l) => '<li>' + inline(l.replace(/^\s*\d+[.)]\s+/, '')) + '</li>').join('') + '</ol>';
        return '<p>' + lines.map(inline).join('<br>') + '</p>';
      }).join('');
    }).join('');
  }
  function inline(s) {
    return esc(s)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  }
  function plain(s, n) {
    const t = String(s || '').replace(/```[\s\S]*?```/g, ' [code] ').replace(/[`*#>]/g, '').replace(/\s+/g, ' ').trim();
    return t.length > n ? t.slice(0, n) + '…' : t;
  }

  function points(email, sinceMs) {
    let p = 0;
    DATA.threads.forEach((t) => live(t.answers).forEach((a) => {
      if (a.authorEmail !== email || Date.parse(a.createdAt) < sinceMs) return;
      p += 2 + (a.votes || []).length + (t.acceptedId === a.id ? 10 : 0);
    }));
    return p;
  }

  // ---------------------------------------------------------------- routing
  window.addEventListener('hashchange', () => { $('sidebar').classList.remove('open'); render(); $('view').scrollTop = 0; });
  function route() {
    const h = location.hash.replace(/^#\/?/, '');
    const [name, arg] = h.split('/');
    return { name: name || 'feed', arg: arg ? decodeURIComponent(arg) : '' };
  }

  function render() {
    if (!DATA) return;
    renderSidebar();
    const r = route();
    const v = $('view');
    if (r.name === 't') v.innerHTML = viewThread(r.arg);
    else if (r.name === 'ask') v.innerHTML = viewAsk();
    else if (r.name === 'insights' && canInsights()) v.innerHTML = viewInsights();
    else if (r.name === 'admin' && isAdmin()) v.innerHTML = viewAdmin();
    else {
      if (['latest', 'unanswered', 'discussions', 'following', 'mine'].includes(r.arg)) UI.tab = r.arg;
      v.innerHTML = viewFeed();
    }
    if (r.name === 'ask') updateSimilar();
  }

  // ---------------------------------------------------------------- sidebar
  function renderSidebar() {
    if (!SESSION) return;
    const r = route();
    const unanswered = DATA ? DATA.threads.filter((t) => t.type === 'question' && !live(t.answers).length).length : 0;
    const follows = (DATA && DATA.myFollows) || [];
    const nav = [
      { href: '#/feed/latest', label: 'Community feed', on: r.name === 'feed' && UI.tab === 'latest' },
      { href: '#/feed/unanswered', label: 'Unanswered', on: r.name === 'feed' && UI.tab === 'unanswered', count: unanswered },
      { href: '#/feed/following', label: 'Following', on: r.name === 'feed' && UI.tab === 'following' },
      { href: '#/feed/mine', label: 'My threads', on: r.name === 'feed' && UI.tab === 'mine' },
      { href: '#/ask', label: 'Ask a question', on: r.name === 'ask' }
    ];
    if (canInsights()) nav.push({ href: '#/insights', label: 'Learning insights', on: r.name === 'insights' });
    if (isAdmin()) nav.push({ href: '#/admin', label: 'Admin', on: r.name === 'admin' });
    const pts = DATA ? points(SESSION.email, 0) : 0;
    $('sidebar').innerHTML = `
      <div class="brand">${I.logo}<div><div class="brand-name">Techment</div><div class="brand-sub">Tech Forum</div></div></div>
      <nav class="nav" aria-label="Main">${nav.map((n) => `<a href="${n.href}" class="${n.on ? 'active' : ''}" ${n.on ? 'aria-current="page"' : ''}><span>${n.label}</span>${n.count ? `<span class="count">${n.count}</span>` : ''}</a>`).join('')}</nav>
      <div class="techs"><div class="side-h">Technologies</div>
        ${(DATA ? DATA.tags : []).map((tg) => {
          const f = follows.includes(tg);
          return `<div class="tech"><a href="#/feed" data-tag="${esc(tg)}" class="${r.name === 'feed' && UI.tag === tg ? 'on' : ''}"># ${esc(tg)}</a><button type="button" class="follow" data-follow="${esc(tg)}" aria-pressed="${f}">${f ? 'Following' : 'Follow'}</button></div>`;
        }).join('')}
      </div>
      <div class="me"><div class="avatar">${esc(initials(SESSION.name))}</div><div><div class="me-name">${esc(SESSION.name)}</div><div class="me-sub">${esc(SESSION.role)} · ${pts} pts</div></div><button type="button" class="signout" data-signout>Sign out</button></div>`;
  }

  // ---------------------------------------------------------------- feed
  function filteredThreads() {
    const q = UI.q.trim().toLowerCase();
    const follows = DATA.myFollows || [];
    return DATA.threads.filter((t) => {
      if (t.deleted) return false;
      if (UI.tab === 'unanswered' && (t.type !== 'question' || live(t.answers).length)) return false;
      if (UI.tab === 'discussions' && t.type !== 'discussion') return false;
      if (UI.tab === 'following' && !t.tags.some((g) => follows.includes(g))) return false;
      if (UI.tab === 'mine' && !(t.mine || live(t.answers).some((a) => a.authorEmail === SESSION.email))) return false;
      if (UI.tag !== 'All' && !t.tags.includes(UI.tag)) return false;
      if (q) {
        const hay = (t.title + ' ' + t.body + ' ' + t.tags.join(' ') + ' ' + (t.authorName || '') + ' ' + live(t.answers).map((a) => a.body).join(' ')).toLowerCase();
        if (!q.split(/\s+/).every((w) => hay.includes(w))) return false;
      }
      return true;
    }).sort((a, b) => Date.parse(b.updatedAt || b.createdAt) - Date.parse(a.updatedAt || a.createdAt));
  }

  function voteBtn(pressed, attrs, label, disabled) {
    return `<button type="button" class="vote" ${attrs} aria-pressed="${pressed}" aria-label="${label}" ${disabled ? 'disabled title="You can’t upvote your own post"' : ''}>${I.up}</button>`;
  }

  function threadCard(t) {
    const st = status(t);
    const n = live(t.answers).length;
    const voted = (t.votes || []).includes(SESSION.email);
    const box = t.acceptedId ? 'solved' : (n === 0 && t.type === 'question' ? 'none' : '');
    return `<article class="card post">
      <div class="vote-col">${voteBtn(voted, `data-vote="${t.id}"`, 'Upvote', t.mine)}<span class="vote-n">${(t.votes || []).length}</span></div>
      <div class="post-body">
        <div class="meta-row"><span class="pill ${st.cls}">${st.label}</span><span>${esc(authorLine(t))} · ${ago(t.createdAt)}</span></div>
        <a class="post-title" href="#/t/${encodeURIComponent(t.id)}">${esc(t.title)}</a>
        ${t.body ? `<p class="excerpt">${esc(plain(t.body, 220))}</p>` : ''}
        <div class="tags">${t.tags.map((g) => `<span class="tag">${esc(g)}</span>`).join('')}</div>
      </div>
      <div class="ans-box ${box}"><b>${n}</b><span>${answerWord(t, n)}</span></div>
    </article>`;
  }

  function viewFeed() {
    const list = filteredThreads();
    const tabs = [['latest', 'Latest'], ['unanswered', 'Unanswered'], ['discussions', 'Discussions'], ['following', 'Following'], ['mine', 'Mine']];
    const titles = { latest: 'Community feed', unanswered: 'Waiting for an answer', discussions: 'Discussions', following: 'Technologies you follow', mine: 'My threads' };
    const followsNone = UI.tab === 'following' && !(DATA.myFollows || []).length;
    return `<div class="cols"><div class="col-main">
      <div class="page-h"><h1>${titles[UI.tab]}</h1><p>Questions and discussions from Techment's engineering teams. Search before you ask — your answer may already be here.</p></div>
      <div class="banner banner-info" id="staleBar" style="display:${STALE ? 'flex' : 'none'};justify-content:space-between">New activity since you opened this page.<button type="button" class="btn btn-sm btn-ghost" data-refresh>Show</button></div>
      <div class="tabs"><div class="tablist" role="tablist">${tabs.map(([id, l]) => `<a class="tab" role="tab" href="#/feed/${id}" aria-selected="${UI.tab === id}">${l}</a>`).join('')}</div>
        <span class="hint">${list.length} ${list.length === 1 ? 'thread' : 'threads'}</span></div>
      <div class="chips">${['All'].concat(DATA.tags).map((g) => `<button type="button" class="chip" data-chip="${esc(g)}" aria-pressed="${UI.tag === g}">${esc(g)}</button>`).join('')}</div>
      ${list.length ? `<div style="display:flex;flex-direction:column;gap:14px">${list.map(threadCard).join('')}</div>`
        : `<div class="empty"><h2>${followsNone ? 'Follow a few technologies' : 'Nothing here yet'}</h2><span class="hint">${followsNone ? 'Use Follow next to a technology in the menu to build this feed.' : (UI.q ? 'No threads match your search.' : 'No threads match this filter. Be the first to ask.')}</span><a class="btn btn-primary" href="#/ask" style="text-decoration:none">Ask a question</a></div>`}
    </div>${feedRail()}</div>`;
  }

  function feedRail() {
    const ev = DATA.event;
    const since = Date.now() - 30 * 864e5;
    const helpers = PEOPLE.map((p) => ({ p, pts: points(p.email, since), acc: DATA.threads.filter((t) => t.acceptedId && live(t.answers).some((a) => a.id === t.acceptedId && a.authorEmail === p.email && Date.parse(a.createdAt) >= since)).length }))
      .filter((x) => x.pts > 0).sort((a, b) => b.pts - a.pts).slice(0, 5);
    const champs = DATA.tags.filter((g) => DATA.champions[g]);
    return `<aside class="col-rail">
      ${ev && ev.active ? `<section class="rail-card rail-dark"><span class="badge-teal">Happening now</span><h2 style="font-size:20px;line-height:1.3">${esc(ev.title)}</h2>${ev.text ? `<p>${esc(ev.text)}</p>` : ''}${ev.tag ? `<a class="btn-outline" href="#/feed" data-tag="${esc(ev.tag)}">Browse ${esc(ev.tag)} threads</a>` : ''}</section>` : ''}
      <section class="rail-card"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px"><h2>Top helpers this month</h2><span class="hint" style="font-size:12px">Recognition</span></div>
        ${helpers.length ? helpers.map((h, i) => `<div class="person"><div class="avatar ${i === 0 ? 'top' : ''}">${esc(initials(h.p.name))}</div><div style="flex-grow:1;min-width:0"><div class="person-name">${esc(h.p.name)}</div><div class="person-sub">${h.acc ? h.acc + ' accepted ' + (h.acc === 1 ? 'answer' : 'answers') + ' · ' : ''}${h.pts} pts</div></div></div>`).join('')
          : '<span class="hint">Answer a question to appear here.</span>'}
        <span class="hint" style="font-size:12px">2 pts per answer, 1 per upvote, 10 when accepted.</span>
      </section>
      <section class="rail-card"><h2>Tech champions</h2><p class="hint" style="margin:0">Each area has a champion who looks after unanswered questions.</p>
        ${champs.length ? champs.map((g) => `<div class="kv"><span>${esc(g)}</span><span>${esc(nameOf(DATA.champions[g]))}</span></div>`).join('') : '<span class="hint">Champions will be listed here.</span>'}
      </section>
    </aside>`;
  }

  // ---------------------------------------------------------------- thread
  function viewThread(id) {
    const t = DATA.threads.find((x) => x.id === id);
    if (!t) return `<div class="cols"><div class="col-main"><div class="empty"><h2>Thread not found</h2><span class="hint">It may have been removed.</span><a class="btn btn-primary" href="#/feed" style="text-decoration:none">Back to feed</a></div></div></div>`;
    const st = status(t);
    const answers = t.answers.slice().sort((a, b) => (b.id === t.acceptedId) - (a.id === t.acceptedId) || Date.parse(a.createdAt) - Date.parse(b.createdAt));
    const n = live(answers).length;
    const isQ = t.type === 'question';
    const canAccept = isQ && (t.mine || canCurate());
    const voted = (t.votes || []).includes(SESSION.email);
    const fb = t.ai ? ((t.ai.up || []).includes(SESSION.email) ? 'up' : (t.ai.down || []).includes(SESSION.email) ? 'down' : '') : '';
    const canSummarise = (t.mine || canCurate()) && n > 0;
    const champs = t.tags.map((g) => DATA.champions[g] ? { g, name: nameOf(DATA.champions[g]) } : null).filter(Boolean);
    const words = new Set(tok(t.title));
    const related = DATA.threads.filter((x) => x.id !== t.id && !x.deleted)
      .map((x) => ({ x, s: x.tags.filter((g) => t.tags.includes(g)).length * 2 + tok(x.title).filter((w) => words.has(w)).length }))
      .filter((r) => r.s > 0).sort((a, b) => b.s - a.s).slice(0, 4).map((r) => r.x);

    return `<div class="cols"><div class="col-main">
      <a class="btn-link" href="#/feed" style="align-self:flex-start;display:inline-flex;align-items:center;gap:6px;text-decoration:none">${I.back} Back to feed</a>
      ${t.deleted ? '<div class="banner banner-warn">This thread was removed. Only admins can see it.</div>' : ''}
      <article class="card post" style="padding:26px 28px">
        <div class="vote-col">${voteBtn(voted, `data-vote="${t.id}"`, 'Upvote question', t.mine)}<span class="vote-n">${(t.votes || []).length}</span></div>
        <div class="post-body thread-h" style="gap:14px">
          <div class="meta-row"><span class="pill ${st.cls}">${st.label}</span><span>${esc(authorLine(t))} · ${ago(t.createdAt)}</span>${flagBadge(t)}</div>
          <h1>${esc(t.title)}</h1>
          ${t.body ? `<div class="md">${md(t.body)}</div>` : ''}
          <div class="tags">${t.tags.map((g) => `<span class="tag">${esc(g)}</span>`).join('')}</div>
          <div class="actions">${postActions(t, null)}</div>
        </div>
      </article>

      ${t.ai ? `<section class="ai" aria-label="AI first response">
          <div class="ai-h"><div class="ai-icon">${I.spark}</div><b>AI first response</b><span class="ai-tag">Draft · check before relying on it</span></div>
          <div class="md">${md(t.ai.text)}</div>
          <div class="fb"><span>Was this useful?</span>
            <button type="button" class="up" data-aifb="up" data-id="${t.id}" aria-pressed="${fb === 'up'}">Helpful</button>
            <button type="button" class="down" data-aifb="down" data-id="${t.id}" aria-pressed="${fb === 'down'}">Needs a human</button>
            <span style="color:var(--teal-ink);font-weight:500">${fb === 'up' ? 'Thanks — this helps improve drafts.' : fb === 'down' ? 'Thanks — the champion will take a look.' : ''}</span></div>
        </section>`
        : (isQ && PENDING_AI[t.id] ? `<section class="ai"><div class="pending"><span class="dots"><span></span><span></span><span></span></span>Writing an AI first response from similar solved threads…</div></section>` : '')}

      ${t.takeaways && t.takeaways.length ? `<section class="card" style="padding:20px 24px;display:flex;flex-direction:column;gap:10px">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><h2 style="font-size:16px">Key takeaways</h2><span class="hint" style="font-size:12px">AI summary${t.takeawaysAt ? ' · ' + ago(t.takeawaysAt) : ''}</span></div>
          ${t.takeaways.map((k) => `<div class="takeaway"><i></i><span>${esc(k)}</span></div>`).join('')}
        </section>` : ''}

      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
        <h2 style="font-size:18px">${n} ${answerWord(t, n)}</h2>
        <div class="actions">${canAccept && n ? '<span class="hint">Mark the answer that solved it</span>' : ''}${canSummarise ? `<button type="button" class="btn btn-sm btn-ghost" data-summarise="${t.id}">${t.takeaways && t.takeaways.length ? 'Refresh takeaways' : 'Summarise thread'}</button>` : ''}</div>
      </div>

      ${answers.map((a) => answerCard(t, a, canAccept)).join('')}

      ${n === 0 ? `<div class="banner banner-warn" style="font-weight:400;line-height:1.55">No answers yet${champs.length ? ' — ' + esc(champs.map((c) => c.name).join(', ')) + ' looks after ' + esc(champs.map((c) => c.g).join(', ')) + ' questions' : ''}. You could be the one who helps.</div>` : ''}

      <section class="card" style="padding:22px 24px;display:flex;flex-direction:column;gap:12px">
        <label for="reply" style="font-family:var(--display);font-size:16px;font-weight:600">${isQ ? 'Your answer' : 'Join the discussion'}</label>
        <textarea class="textarea" id="reply" data-reply="${t.id}" rows="5" placeholder="Share what worked for you. Use \`\`\` for code blocks and remove client-specific details.">${esc(REPLY[t.id] || '')}</textarea>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
          <span class="hint">Supports **bold**, \`code\`, \`\`\`code blocks\`\`\`, lists and links</span>
          <button type="button" class="btn btn-primary" data-post-reply="${t.id}" ${REPLY[t.id] && REPLY[t.id].trim() ? '' : 'disabled'}>Post ${isQ ? 'answer' : 'reply'}</button>
        </div>
      </section>
    </div>

    <aside class="col-rail">
      <section class="rail-card"><h2>Related threads</h2>
        ${related.length ? related.map((x) => { const s = status(x); const k = live(x.answers).length; return `<a class="rel" href="#/t/${encodeURIComponent(x.id)}"><b>${esc(x.title)}</b><span>${s.label} · ${k} ${answerWord(x, k)}</span></a>`; }).join('') : '<span class="hint">No related threads yet.</span>'}
      </section>
      ${champs.length ? `<section class="rail-card"><h2>Tech champions</h2>${champs.map((c) => `<div class="kv"><span>${esc(c.g)}</span><span>${esc(c.name)}</span></div>`).join('')}</section>` : ''}
      <section class="rail-card rail-dark"><span class="badge-teal">From the Learning team</span><p>Solved threads are reviewed for the knowledge base, and recurring topics become short learning modules.</p></section>
    </aside></div>`;
  }

  function answerCard(t, a, canAccept) {
    const accepted = t.acceptedId === a.id;
    const voted = (a.votes || []).includes(SESSION.email);
    const mine = a.authorEmail === SESSION.email;
    const p = people(a.authorEmail);
    const isChamp = t.tags.some((g) => DATA.champions[g] === a.authorEmail);
    return `<article class="card post answer ${accepted ? 'accepted' : ''}">
      <div class="vote-col">${voteBtn(voted, `data-vote="${t.id}" data-answer="${a.id}"`, 'Upvote answer', mine)}<span class="vote-n">${(a.votes || []).length}</span></div>
      <div class="post-body" style="gap:12px">
        <div class="meta-row"><b style="color:var(--ink);font-size:14px">${esc(a.authorName)}</b>${p && p.role !== 'Member' ? `<span>${esc(p.role)}</span>` : ''}${isChamp ? '<span class="champ">Tech champion</span>' : ''}<span>· ${ago(a.createdAt)}</span>${flagBadge(a)}${a.deleted ? '<span class="flagged">Removed</span>' : ''}</div>
        <div class="md">${md(a.body)}</div>
        <div class="actions">
          ${accepted ? `<span class="acc">${I.check} Accepted answer</span>` : ''}
          ${canAccept && !a.deleted ? `<button type="button" class="btn btn-sm btn-ghost" data-accept="${t.id}" data-answer="${a.id}">${accepted ? 'Undo accept' : 'Mark as accepted'}</button>` : ''}
          ${postActions(t, a)}
        </div>
      </div>
    </article>`;
  }

  function flagBadge(x) {
    const n = x.flags ? x.flags.length : (x.flagCount || 0);
    return n && isAdmin() ? `<span class="flagged">${n} ${n === 1 ? 'flag' : 'flags'}</span>` : '';
  }

  function postActions(t, a) {
    const target = a || t;
    const mine = a ? a.authorEmail === SESSION.email : t.mine;
    const attrs = `data-thread="${t.id}"${a ? ` data-answer="${a.id}"` : ''}`;
    let out = '';
    if (!mine) out += `<button type="button" class="btn btn-sm btn-link" data-flag ${attrs}>Report</button>`;
    if ((mine || isAdmin()) && !target.deleted) out += `<button type="button" class="btn btn-sm btn-link" style="color:var(--red-ink)" data-delete ${attrs}>Delete</button>`;
    if (isAdmin() && target.flags && target.flags.length) out += `<button type="button" class="btn btn-sm btn-link" data-clearflags ${attrs}>Clear flags</button>`;
    return out;
  }

  function tok(s) { return String(s || '').toLowerCase().split(/[^a-z0-9.+#]+/).filter((w) => w.length > 3); }

  // ---------------------------------------------------------------- ask
  function viewAsk() {
    const types = [
      ['question', 'Question', 'A specific problem with a best answer. You can accept one.'],
      ['discussion', 'Discussion', 'Open-ended: approaches, trade-offs, lessons learned.']
    ];
    const canPost = ASK.title.trim().length >= 6;
    return `<div class="cols"><div class="col-main">
      <div class="page-h"><h1>Start a thread</h1><p>Ask a specific question, or open a discussion for broader topics.</p></div>
      <form class="card" id="askForm" style="padding:28px;display:flex;flex-direction:column;gap:24px;max-width:820px">
        <fieldset style="border:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px"><legend style="font-size:14px;font-weight:600;padding:0;margin-bottom:10px">Thread type</legend>
          <div class="type-grid">${types.map(([id, l, h]) => `<button type="button" class="type-opt" data-type="${id}" aria-pressed="${ASK.type === id}"><b>${l}</b><span>${h}</span></button>`).join('')}</div>
        </fieldset>
        <div style="display:flex;flex-direction:column;gap:8px">
          <label class="field" for="askTitle">Title</label>
          <input class="input" id="askTitle" maxlength="200" value="${esc(ASK.title)}" placeholder="e.g. How do I share Terraform state safely across pipelines?" autocomplete="off">
          <div id="similar"></div>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <label class="field" for="askBody">Details</label>
          <textarea class="textarea" id="askBody" rows="8" placeholder="What are you trying to do, what have you tried, and what happened? Wrap code or error messages in \`\`\` fences.">${esc(ASK.body)}</textarea>
        </div>
        <div style="display:flex;flex-direction:column;gap:10px">
          <span style="font-size:14px;font-weight:600">Technologies <span class="hint">— pick up to 3</span></span>
          <div class="chips">${DATA.tags.map((g) => `<button type="button" class="chip pick" data-asktag="${esc(g)}" aria-pressed="${ASK.tags.includes(g)}">${esc(g)}</button>`).join('')}</div>
        </div>
        <div class="switch-row"><div><div style="font-size:14px;font-weight:600">Post anonymously</div><div class="hint">Your name is hidden from other members. Forum admins can still see it.</div></div>
          <button type="button" class="switch" role="switch" id="anonSwitch" aria-checked="${ASK.anon}" aria-label="Post anonymously"><i></i></button></div>
        <div class="banner banner-warn" style="font-weight:400;line-height:1.55">${I.warn}<span>Before posting: remove client names, credentials, internal URLs and any client-confidential code. Share only the smallest snippet needed to show the issue.</span></div>
        <div style="display:flex;justify-content:flex-end;gap:12px">
          <a class="btn btn-ghost" href="#/feed" style="text-decoration:none">Cancel</a>
          <button type="submit" class="btn btn-primary" id="askSubmit" ${canPost ? '' : 'disabled'}>${ASK.type === 'question' ? 'Post question' : 'Start discussion'}</button>
        </div>
      </form>
    </div>
    <aside class="col-rail">
      <section class="rail-card"><h2>Writing a good question</h2>
        ${['Summarise the problem in the title, like a bug report.', 'Say what you expected, what happened and what you tried.', 'Include the smallest code sample that shows it.', 'Tag the technologies so the right people see it.'].map((s, i) => `<div class="step"><b>${i + 1}</b><span>${s}</span></div>`).join('')}
      </section>
      <section class="rail-card" style="background:var(--blue-wash);border-color:var(--blue-line)"><h2>What happens next</h2><p style="margin:0;font-size:14px;line-height:1.55;color:var(--ink2)">Questions get an AI first response within a minute, clearly labelled. Colleagues who follow your tags see the thread in their feed, and the tech champion keeps an eye on anything unanswered.</p></section>
    </aside></div>`;
  }

  function updateSimilar() {
    const el = $('similar');
    if (!el) return;
    const words = tok(ASK.title);
    if (!words.length || ASK.title.trim().length < 8) { el.innerHTML = ''; return; }
    const hits = DATA.threads.filter((t) => !t.deleted).map((t) => {
      const hay = (t.title + ' ' + t.tags.join(' ')).toLowerCase();
      return { t, s: words.filter((w) => hay.includes(w)).length };
    }).filter((x) => x.s > 0).sort((a, b) => b.s - a.s).slice(0, 3);
    el.innerHTML = hits.length ? `<div class="similar"><span style="font-size:13px;font-weight:600;color:var(--blue-ink)">These threads may already answer it</span>${hits.map(({ t }) => { const s = status(t); return `<a href="#/t/${encodeURIComponent(t.id)}"><span>${esc(t.title)}</span><span class="pill ${s.cls}" style="flex-shrink:0">${s.label}</span></a>`; }).join('')}</div>` : '';
  }

  // ---------------------------------------------------------------- insights
  function median(arr) { if (!arr.length) return null; const s = arr.slice().sort((a, b) => a - b); const m = Math.floor(s.length / 2); return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; }

  function viewInsights() {
    const since = Date.now() - 30 * 864e5;
    const recent = DATA.threads.filter((t) => !t.deleted && Date.parse(t.createdAt) >= since);
    const qs = recent.filter((t) => t.type === 'question');
    const firstAnswer = qs.map((t) => { const a = live(t.answers)[0]; return a ? Date.parse(a.createdAt) - Date.parse(t.createdAt) : null; }).filter((x) => x != null);
    const med = median(firstAnswer);
    const solved = qs.filter((t) => t.acceptedId).length;
    const contributors = new Set();
    recent.forEach((t) => live(t.answers).forEach((a) => contributors.add(a.authorEmail)));
    DATA.threads.forEach((t) => live(t.answers).forEach((a) => { if (Date.parse(a.createdAt) >= since) contributors.add(a.authorEmail); }));
    let up = 0, down = 0;
    recent.forEach((t) => { if (t.ai) { up += (t.ai.up || []).length; down += (t.ai.down || []).length; } });
    const tagCounts = DATA.tags.map((g) => ({ g, n: recent.filter((t) => t.tags.includes(g)).length })).filter((x) => x.n).sort((a, b) => b.n - a.n);
    const maxN = tagCounts.length ? tagCounts[0].n : 1;
    const waiting = DATA.threads.filter((t) => !t.deleted && t.type === 'question' && !live(t.answers).length).sort((a, b) => Date.parse(a.createdAt) - Date.parse(b.createdAt));

    const kpis = [
      ['Median time to first answer', med == null ? '—' : duration(med), firstAnswer.length + ' answered questions'],
      ['Questions solved', qs.length ? Math.round(solved / qs.length * 100) + '%' : '—', solved + ' of ' + qs.length + ' with an accepted answer'],
      ['Active contributors', String(contributors.size), 'Posted at least one answer or reply'],
      ['AI drafts rated helpful', up + down ? Math.round(up / (up + down) * 100) + '%' : '—', (up + down) + ' ratings']
    ];
    return `<div class="cols" style="flex-direction:column;align-items:stretch"><div style="display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap">
        <div class="page-h"><h1>Learning insights</h1><p>Community health and the learning needs it reveals, for the L&amp;D team and tech champions.</p></div>
        <span class="pill pill-open">Last 30 days · ${recent.length} threads</span></div>
      <div class="kpis">${kpis.map(([l, v, s]) => `<div class="kpi"><span>${l}</span><b>${v}</b><small>${s}</small></div>`).join('')}</div>
      <div class="grid2">
        <section class="rail-card" style="gap:14px"><div style="display:flex;justify-content:space-between;align-items:baseline"><h2>Most-asked technologies</h2><span class="hint" style="font-size:12px">Threads opened</span></div>
          ${tagCounts.length ? tagCounts.map((x) => `<div class="bar-row"><span style="color:var(--ink3)">${esc(x.g)}</span><div class="bar"><i style="width:${Math.max(4, Math.round(x.n / maxN * 100))}%"></i></div><span style="font-weight:600;text-align:right">${x.n}</span></div>`).join('') : '<span class="hint">No threads in the last 30 days.</span>'}
        </section>
        <section class="rail-card rail-dark" style="gap:14px"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><h2>Suggested learning modules</h2>
            <button type="button" class="btn btn-sm" style="background:var(--teal);color:var(--navy)" data-modules>${MODULES_TEXT ? 'Refresh' : 'Suggest from recent threads'}</button></div>
          <div class="md ai-out" id="modulesOut" style="color:#E6ECF8">${MODULES_TEXT ? md(MODULES_TEXT) : '<p style="color:var(--on-navy)">AI reads the last 60 days of thread titles and tags and proposes short modules for recurring themes.</p>'}</div>
        </section>
      </div>
      <section class="rail-card"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px"><h2>Waiting for a first answer</h2><span class="hint" style="font-size:12px">Oldest first</span></div>
        ${waiting.length ? `<div style="overflow-x:auto"><table class="table"><thead><tr><th>Question</th><th>Technologies</th><th>Champion</th><th>Open for</th></tr></thead><tbody>
          ${waiting.map((t) => `<tr><td><a href="#/t/${encodeURIComponent(t.id)}">${esc(t.title)}</a></td><td>${esc(t.tags.join(', ') || '—')}</td><td>${esc(t.tags.map((g) => DATA.champions[g] ? nameOf(DATA.champions[g]) : '').filter(Boolean).join(', ') || 'Not assigned')}</td><td style="color:var(--amber-ink);font-weight:500">${duration(Date.now() - Date.parse(t.createdAt))}</td></tr>`).join('')}
          </tbody></table></div>` : '<span class="hint">Every question has at least one answer.</span>'}
      </section>
    </div>`;
  }

  // ---------------------------------------------------------------- admin
  function viewAdmin() {
    const flagged = [];
    DATA.threads.forEach((t) => {
      if ((t.flags || []).length) flagged.push({ t, a: null, flags: t.flags });
      t.answers.forEach((a) => { if ((a.flags || []).length) flagged.push({ t, a, flags: a.flags }); });
    });
    const ev = DATA.event || {};
    const roles = ['Member', 'Champion', 'Leadership', 'Admin'];
    return `<div class="cols" style="flex-direction:column;align-items:stretch">
      <div class="page-h"><h1>Admin</h1><p>Members, tech champions, technologies, the featured event and reported content.</p></div>

      <section class="rail-card"><h2>Reported content</h2>
        ${flagged.length ? `<table class="table"><thead><tr><th>Item</th><th>Reason</th><th></th></tr></thead><tbody>${flagged.map((f) => `<tr><td><a href="#/t/${encodeURIComponent(f.t.id)}">${esc(f.a ? 'Answer on: ' + f.t.title : f.t.title)}</a></td><td>${esc(f.flags.map((x) => x.reason).join('; '))}</td><td style="text-align:right;white-space:nowrap"><button type="button" class="btn btn-sm btn-ghost" data-clearflags data-thread="${f.t.id}" ${f.a ? `data-answer="${f.a.id}"` : ''}>Keep</button> <button type="button" class="btn btn-sm btn-danger" data-delete data-thread="${f.t.id}" ${f.a ? `data-answer="${f.a.id}"` : ''}>Remove</button></td></tr>`).join('')}</tbody></table>` : '<span class="hint">Nothing reported.</span>'}
      </section>

      <section class="rail-card"><h2>Members</h2>
        <form id="userForm" class="form-row">
          <label class="field">Email<input class="input" name="email" type="email" required placeholder="name@techment.com"></label>
          <label class="field">Name<input class="input" name="name" required placeholder="Full name"></label>
          <label class="field">Role<select class="select input" name="role">${roles.map((r) => `<option>${r}</option>`).join('')}</select></label>
          <label class="field">Password<input class="input" name="password" type="text" placeholder="New members only" autocomplete="new-password"></label>
          <button class="btn btn-primary" type="submit">Save member</button>
        </form>
        <p class="hint" style="margin:0">Saving an existing email updates their name and role; enter a password only to reset it. Passwords are stored as SHA-256 hashes.</p>
        <div style="overflow-x:auto"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th></th></tr></thead><tbody>
          ${PEOPLE.slice().sort((a, b) => a.name.localeCompare(b.name)).map((p) => `<tr><td>${esc(p.name)}</td><td>${esc(p.email)}</td><td>${esc(p.role)}</td><td style="text-align:right">${p.email === SESSION.email ? '' : `<button type="button" class="btn btn-sm btn-link" style="color:var(--red-ink)" data-removeuser="${esc(p.email)}">Remove</button>`}</td></tr>`).join('')}
        </tbody></table></div>
      </section>

      <div class="grid2">
        <section class="rail-card"><h2>Tech champions</h2>
          ${DATA.tags.map((g) => `<div class="kv" style="align-items:center"><span>${esc(g)}</span><select class="select input" style="max-width:240px;height:40px" data-champion="${esc(g)}"><option value="">Not assigned</option>${PEOPLE.map((p) => `<option value="${esc(p.email)}" ${DATA.champions[g] === p.email ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></div>`).join('')}
        </section>
        <div style="display:flex;flex-direction:column;gap:16px">
          <section class="rail-card"><h2>Featured event</h2>
            <form id="eventForm" style="display:flex;flex-direction:column;gap:12px">
              <label class="field">Title<input class="input" name="title" value="${esc(ev.title || '')}" placeholder="Ask the Experts: Azure"></label>
              <label class="field">Description<textarea class="textarea" name="text" rows="3" placeholder="Cloud champions are answering every Azure question within the day.">${esc(ev.text || '')}</textarea></label>
              <label class="field">Technology<select class="select input" name="tag"><option value="">None</option>${DATA.tags.map((g) => `<option ${ev.tag === g ? 'selected' : ''}>${esc(g)}</option>`).join('')}</select></label>
              <div style="display:flex;gap:10px"><button class="btn btn-primary" type="submit">Show on feed</button>${ev.active ? '<button class="btn btn-ghost" type="button" data-event-off>Hide</button>' : ''}</div>
            </form>
          </section>
          <section class="rail-card"><h2>Technologies</h2>
            <div class="chips">${DATA.tags.map((g) => `<span class="chip" style="display:inline-flex;align-items:center;gap:6px">${esc(g)}<button type="button" data-removetag="${esc(g)}" aria-label="Remove ${esc(g)}" style="border:none;background:none;color:var(--muted);padding:0 2px;font-size:16px;line-height:1">×</button></span>`).join('')}</div>
            <form id="tagForm" style="display:flex;gap:10px"><label class="sr" for="newTag">New technology</label><input class="input" id="newTag" name="name" placeholder="e.g. Kubernetes" maxlength="30"><button class="btn btn-ghost" type="submit">Add</button></form>
          </section>
        </div>
      </div>
    </div>`;
  }

  // ---------------------------------------------------------------- events
  document.addEventListener('click', async (e) => {
    const el = e.target.closest('button, a');
    if (!el) return;
    const d = el.dataset;

    if (d.signout !== undefined) return signOut();
    if (d.tag !== undefined) { e.preventDefault(); UI.tag = d.tag; if (route().name !== 'feed') location.hash = '#/feed/' + UI.tab; else render(); return; }
    if (d.chip !== undefined) { UI.tag = d.chip; return render(); }
    if (d.refresh !== undefined) { setData(DATA); return render(); }
    if (d.follow !== undefined) return op('follow', { tag: d.follow, on: el.getAttribute('aria-pressed') !== 'true' }).catch(() => {});
    if (d.vote !== undefined) return op('vote', { threadId: d.vote, answerId: d.answer || undefined }).catch(() => {});
    if (d.accept !== undefined) return op('accept', { threadId: d.accept, answerId: d.answer }, 'Updated accepted answer').catch(() => {});
    if (d.aifb !== undefined) return op('aiFeedback', { threadId: d.id, value: el.getAttribute('aria-pressed') === 'true' ? '' : d.aifb }).catch(() => {});
    if (d.copy !== undefined) { const code = el.closest('.code').querySelector('code').textContent; try { await navigator.clipboard.writeText(code); el.textContent = 'Copied'; setTimeout(() => { el.textContent = 'Copy'; }, 1500); } catch (x) { toast('Copy failed'); } return; }
    if (d.type !== undefined) { ASK.type = d.type; return render(); }
    if (d.asktag !== undefined) {
      const i = ASK.tags.indexOf(d.asktag);
      if (i >= 0) ASK.tags.splice(i, 1); else if (ASK.tags.length < 3) ASK.tags.push(d.asktag); else toast('Pick up to 3 technologies');
      return render();
    }
    if (el.id === 'anonSwitch') { ASK.anon = !ASK.anon; el.setAttribute('aria-checked', ASK.anon); return; }
    if (d.postReply !== undefined) {
      const text = (REPLY[d.postReply] || '').trim();
      if (!text) return;
      el.disabled = true;
      try { await op('addAnswer', { threadId: d.postReply, body: text }, 'Posted — thank you for helping'); REPLY[d.postReply] = ''; render(); } catch (x) { el.disabled = false; }
      return;
    }
    if (d.summarise !== undefined) {
      el.disabled = true; el.textContent = 'Summarising…';
      try { await op('summarise', { threadId: d.summarise }, 'Takeaways updated'); } catch (x) { el.disabled = false; el.textContent = 'Summarise thread'; }
      return;
    }
    if (d.flag !== undefined) {
      const reason = prompt('What should moderators look at? (for example: client-confidential details, off-topic, unkind)');
      if (reason === null) return;
      return op('flag', { threadId: d.thread, answerId: d.answer || undefined, reason: reason || 'Needs review' }, 'Reported to the moderators').catch(() => {});
    }
    if (d.delete !== undefined) {
      if (!confirm(d.answer ? 'Remove this answer?' : 'Remove this thread?')) return;
      try { await op('delete', { threadId: d.thread, answerId: d.answer || undefined }, 'Removed'); if (!d.answer && route().name === 't' && !isAdmin()) location.hash = '#/feed'; } catch (x) {}
      return;
    }
    if (d.clearflags !== undefined) return op('clearFlags', { threadId: d.thread, answerId: d.answer || undefined }, 'Flags cleared').catch(() => {});
    if (d.modules !== undefined) {
      el.disabled = true; el.textContent = 'Thinking…';
      try { const r = await api('/insights/modules', { method: 'POST', body: {} }); MODULES_TEXT = r.text || ''; render(); }
      catch (x) { toast(x.message); el.disabled = false; el.textContent = 'Suggest from recent threads'; }
      return;
    }
    if (d.removeuser !== undefined) { if (confirm('Remove ' + d.removeuser + ' from the forum?')) op('removeUser', { email: d.removeuser }, 'Member removed').catch(() => {}); return; }
    if (d.removetag !== undefined) { if (confirm('Remove the ' + d.removetag + ' technology? Existing threads keep their tag.')) op('removeTag', { name: d.removetag }).catch(() => {}); return; }
    if (d.eventOff !== undefined) return op('setEvent', { active: false }, 'Event hidden').catch(() => {});
  });

  document.addEventListener('input', (e) => {
    const el = e.target;
    if (el.id === 'search') {
      UI.q = el.value;
      if (route().name !== 'feed') { location.hash = '#/feed/' + UI.tab; } else { const v = $('view'); const st = v.scrollTop; v.innerHTML = viewFeed(); v.scrollTop = st; }
      return;
    }
    if (el.dataset.reply) {
      REPLY[el.dataset.reply] = el.value;
      const b = document.querySelector(`[data-post-reply="${el.dataset.reply}"]`);
      if (b) b.disabled = !el.value.trim();
      return;
    }
    if (el.id === 'askTitle') { ASK.title = el.value; $('askSubmit').disabled = ASK.title.trim().length < 6; updateSimilar(); return; }
    if (el.id === 'askBody') { ASK.body = el.value; return; }
  });

  document.addEventListener('change', (e) => {
    const el = e.target;
    if (el.dataset.champion !== undefined) op('setChampion', { tag: el.dataset.champion, email: el.value }, 'Champion updated').catch(() => {});
  });

  document.addEventListener('submit', async (e) => {
    const f = e.target;
    if (f.id === 'askForm') {
      e.preventDefault();
      const btn = $('askSubmit');
      btn.disabled = true; btn.textContent = 'Posting…';
      try {
        const res = await op('createThread', { type: ASK.type, title: ASK.title, body: ASK.body, tags: ASK.tags, anon: ASK.anon });
        const id = res.result && res.result.id;
        const wasQ = ASK.type === 'question';
        Object.assign(ASK, { type: 'question', title: '', body: '', tags: [], anon: false });
        toast(wasQ ? 'Question posted. An AI first response is on its way.' : 'Discussion started.');
        if (id) { if (wasQ) PENDING_AI[id] = true; location.hash = '#/t/' + encodeURIComponent(id); if (wasQ) watchAi(id); }
      } catch (x) { btn.disabled = false; btn.textContent = 'Try again'; }
      return;
    }
    if (f.id === 'userForm') {
      e.preventDefault();
      const fd = new FormData(f);
      const pw = String(fd.get('password') || '');
      const payload = { email: fd.get('email'), name: fd.get('name'), role: fd.get('role') };
      if (pw) payload.hash = await sha256(pw);
      op('upsertUser', payload, 'Member saved').then(() => f.reset()).catch(() => {});
      return;
    }
    if (f.id === 'eventForm') {
      e.preventDefault();
      const fd = new FormData(f);
      if (!String(fd.get('title')).trim()) return toast('Add a title for the event');
      op('setEvent', { active: true, title: fd.get('title'), text: fd.get('text'), tag: fd.get('tag') }, 'Event shown on the feed').catch(() => {});
      return;
    }
    if (f.id === 'tagForm') {
      e.preventDefault();
      const name = String(new FormData(f).get('name') || '').trim();
      if (name) op('addTag', { name }, 'Technology added').catch(() => {});
    }
  });

  $('menuBtn').addEventListener('click', () => $('sidebar').classList.toggle('open'));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('sidebar').classList.remove('open'); });

  // ---------------------------------------------------------------- boot
  const saved = loadSession();
  if (saved) { SESSION = saved; startApp(); }
})();
</script>
</body>
</html>
